<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Redirect Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-primary: #0d0d1a;
      --bg-secondary: #13131f;
      --bg-card: #1a1a2e;
      --bg-card-hover: #1e1e36;
      --accent: #4fc3f7;
      --accent-dim: rgba(79, 195, 247, 0.15);
      --accent2: #7c4dff;
      --success: #4caf88;
      --success-dim: rgba(76, 175, 136, 0.15);
      --danger: #ff5252;
      --danger-dim: rgba(255, 82, 82, 0.15);
      --warning: #ffb74d;
      --text-primary: #e8eaf6;
      --text-secondary: #8892b0;
      --text-muted: #4a5070;
      --border: rgba(79, 195, 247, 0.12);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      width: 400px;
      min-height: 480px;
      max-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0d0d1a 0%, #13131f 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(79,195,247,0.08), transparent 70%);
      pointer-events: none;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79,195,247,0.25);
    }
    .header-text h1 {
      font-size: 14px; font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }
    .header-text p {
      font-size: 11px; color: var(--text-secondary);
      margin-top: 1px;
    }
    .reload-btn {
      margin-left: auto;
      background: var(--accent-dim);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .reload-btn:hover { background: rgba(79,195,247,0.25); }
    .reload-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 18px;
    }
    .tab {
      padding: 10px 14px;
      font-size: 12px; font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text-secondary); }

    /* ── Content ── */
    .content {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .panel { display: none; padding: 14px 18px; }
    .panel.active { display: block; }

    /* ── Stat row ── */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 14px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      text-align: center;
    }
    .stat-card .val {
      font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-card .lbl {
      font-size: 9px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ── Rule card ── */
    .rules-list { display: flex; flex-direction: column; gap: 8px; }
    .rule-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .rule-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--success);
      border-radius: 3px 0 0 3px;
      transition: background 0.2s;
    }
    .rule-card.disabled::before { background: var(--text-muted); }
    .rule-card:hover { background: var(--bg-card-hover); border-color: rgba(79,195,247,0.2); }

    .rule-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .rule-id {
      font-size: 11px; font-weight: 600;
      color: var(--accent);
      font-family: 'Courier New', monospace;
      background: var(--accent-dim);
      padding: 2px 6px; border-radius: 4px;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rule-card.disabled .rule-id { color: var(--text-muted); background: transparent; }

    .badge {
      font-size: 9px; font-weight: 600;
      padding: 2px 7px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.4px;
      flex-shrink: 0;
    }
    .badge.enabled { background: var(--success-dim); color: var(--success); }
    .badge.disabled { background: var(--danger-dim); color: var(--danger); }

    .rule-arrow {
      display: flex; flex-direction: column; gap: 3px;
    }
    .rule-url {
      font-size: 10px;
      font-family: 'Courier New', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .rule-url .label {
      font-size: 9px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.3px;
      min-width: 22px;
    }
    .rule-url .url-val {
      color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rule-url.to .url-val { color: var(--success); }

    .rule-desc {
      font-size: 10px; color: var(--text-muted);
      margin-top: 6px;
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }

    .type-badge {
      font-size: 9px; color: var(--warning);
      background: rgba(255,183,77,0.1);
      padding: 1px 5px; border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ── History panel ── */
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 10px;
    }
    .history-item .h-rule { color: var(--accent); font-weight: 600; margin-bottom: 3px; }
    .history-item .h-from { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-to { color: var(--success); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-time { color: var(--text-muted); font-size: 9px; margin-top: 3px; }
    .clear-btn {
      width: 100%; padding: 8px;
      background: var(--danger-dim);
      border: 1px solid rgba(255,82,82,0.2);
      color: var(--danger);
      border-radius: var(--radius-sm);
      font-size: 11px; font-weight: 500;
      cursor: pointer; margin-bottom: 10px;
      transition: all 0.2s;
    }
    .clear-btn:hover { background: rgba(255,82,82,0.25); }

    .empty-state {
      text-align: center; padding: 30px 20px;
      color: var(--text-muted); font-size: 12px;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 8px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-left {
      font-size: 10px; color: var(--text-muted);
      display: flex; align-items: center; gap: 5px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 4px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .footer-ver { font-size: 10px; color: var(--text-muted); }

    /* ── HTML Fallback card ── */
    .fallback-card {
      background: var(--bg-card);
      border: 1px solid rgba(124,77,255,0.25);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .fallback-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent2);
      border-radius: 3px 0 0 3px;
    }
    .fb-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .fb-title { font-size: 11px; font-weight: 700; color: var(--accent2); }
    .fb-badge {
      font-size: 9px; font-weight: 700; padding: 2px 7px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .fb-badge.on  { background: var(--success-dim); color: var(--success); }
    .fb-badge.off { background: var(--danger-dim);  color: var(--danger); }
    .fb-desc { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
    .fb-patterns { display: flex; flex-wrap: wrap; gap: 4px; }
    .fb-pattern {
      font-size: 9px; font-family: 'Courier New', monospace;
      background: rgba(124,77,255,0.12); color: var(--accent2);
      padding: 2px 6px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-icon">↪</div>
    <div class="header-text">
      <h1>URL Redirect Pro</h1>
      <p>Tự động redirect theo rules cấu hình</p>
    </div>
    <button class="reload-btn" id="reloadBtn" title="Tải lại config.json">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      Reload
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="rules">📋 Rules</div>
    <div class="tab" data-tab="history">📜 History</div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Rules Panel -->
    <div class="panel active" id="panel-rules">
      <!-- HTML Fallback status card -->
      <div id="htmlFallbackCard" class="fallback-card" style="display:none">
        <div class="fb-header">
          <span class="fb-title">⚡ HTML Fallback</span>
          <span class="fb-badge" id="fbBadge">–</span>
        </div>
        <div class="fb-desc" id="fbDesc">–</div>
        <div class="fb-patterns" id="fbPatterns"></div>
      </div>
      <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="val" id="stat-total">–</div><div class="lbl">Total</div></div>
        <div class="stat-card"><div class="val" id="stat-enabled">–</div><div class="lbl">Active</div></div>
        <div class="stat-card"><div class="val" id="stat-hits">–</div><div class="lbl">Redirects</div></div>
      </div>
      <div class="rules-list" id="rulesList">
        <div class="empty-state"><div class="icon">⚙️</div>Đang tải rules...</div>
      </div>
    </div>

    <!-- History Panel -->
    <div class="panel" id="panel-history">
      <button class="clear-btn" id="clearHistoryBtn">🗑 Xóa lịch sử</button>
      <div class="history-list" id="historyList">
        <div class="empty-state"><div class="icon">📭</div>Chưa có redirect nào được ghi nhận.</div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">
      <div class="status-dot"></div>
      <span id="statusText">Đang hoạt động</span>
    </div>
    <span class="footer-ver">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
